name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t automated-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t automated-frontend:ci ./frontend
