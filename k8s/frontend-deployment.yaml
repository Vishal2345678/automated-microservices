apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 879786009908.dkr.ecr.us-east-1.amazonaws.com/automated-frontend:05dd9dcddc49d9fd3da457e31fc83e7008f30d5e
          ports:
            - containerPort: 8080